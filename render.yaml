services:
  - type: web
    name: medixflow-api
    runtime: node
    # Important: Point to the correct folder in monorepo
    rootDirectory: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: medixflow-db
          property: connectionString
      
      # Redis
      - key: REDIS_URL
        sync: false
      
      # Auth
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      
      # Email
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      
      # Google Auth
      - key: GOOGLE_CLIENT_ID
        sync: false
      
      # Frontend
      - key: FRONTEND_URL
        sync: false
      
      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      # Payment Gateways
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      
      # Optional: Add these if you use them
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false